<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff" />
      <stop offset="100%" style="stop-color:#b44bff" />
    </linearGradient>
    <linearGradient id="phone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060608" />
      <stop offset="100%" style="stop-color:#111116" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" />
  
  <!-- Phone silhouette -->
  <rect x="30" y="18" width="40" height="64" rx="8" fill="url(#phone)" stroke="#00f5ff" stroke-width="1.5"/>
  
  <!-- Screen -->
  <rect x="34" y="24" width="32" height="48" rx="4" fill="#060608" />
  
  <!-- Dynamic island / notch -->
  <rect x="45" y="26" width="10" height="4" rx="2" fill="#00f5ff" opacity="0.3" />
  
  <!-- Camera -->
  <circle cx="50" cy="38" r="3" fill="#00f5ff" opacity="0.5" />
  
  <!-- Signal bars -->
  <g stroke="#00f5ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M60 52 h4" />
    <path d="M60 56 h6" />
    <path d="M60 60 h8" />
    <path d="M60 64 h10" />
  </g>
  
  <!-- Battery -->
  <rect x="65" y="54" width="8" height="5" rx="1" fill="none" stroke="#00f5ff" stroke-width="1" opacity="0.6" />
  <rect x="73" y="55.5" width="1.5" height="2" rx="0.5" fill="#00f5ff" opacity="0.6" />
  <rect x="66" y="55" width="5" height="3" fill="#00ff88" opacity="0.6" />
</svg>